spring.application.name=logistica

# Puerto que utilizará Render
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres_db:5432/logistica_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adminpassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis / Valkey
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

#token jwt
jwt.secret=${JWT_SECRET}
# Clave exclusiva para comunicación entre microservicios
jwt.service.secret=${JWT_SERVICE_SECRET}
# Microservicio de Aduana
aduana.api.url=${ADUANA_API_URL:http://localhost:8082}
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:Port Logistics}
